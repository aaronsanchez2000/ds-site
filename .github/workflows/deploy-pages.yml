name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release data
        run: npm run validate:data

      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir -p site
          cp -R \
            index.html \
            about.html \
            contact.html \
            credits.html \
            epk.html \
            gear.html \
            merch.html \
            music.html \
            CNAME \
            robots.txt \
            sitemap.xml \
            site.webmanifest \
            assets \
            css \
            data \
            js \
            music \
            site/
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
