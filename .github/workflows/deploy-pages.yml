name: Deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 3 7 *" # June 26, 2026 at 12:00 AM EDT

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release data
        run: npm run validate:data

      - name: Generate contact file
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CONTACT_PHONE_DISPLAY: ${{ secrets.CONTACT_PHONE_DISPLAY }}
          CONTACT_PHONE_E164: ${{ secrets.CONTACT_PHONE_E164 }}
          CONTACT_SMS_E164: ${{ secrets.CONTACT_SMS_E164 }}
        run: npm run generate:contact

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
